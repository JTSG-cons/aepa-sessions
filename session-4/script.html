<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session 4 Script</title>
<meta name="description" content="Speaking script (Mongolian) and timing for AEPA Session 4.">
<link rel="icon" href="../assets/logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAFAF7;--ink:#14171C;--body:#374151;--muted:#6B7280;--line:#D9D9D4;--blue:#2F5BEA;--card:#FFFFFF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0F1115;--ink:#ECEDEF;--body:#C9CDD3;--muted:#9AA0A8;--line:#2A2E35;--blue:#7C9BFF;--card:#171A20}}
:root[data-theme="dark"]{--bg:#0F1115;--ink:#ECEDEF;--body:#C9CDD3;--muted:#9AA0A8;--line:#2A2E35;--blue:#7C9BFF;--card:#171A20}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--body);font:17px/1.7 'Inter',Arial,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:40px 16px 80px}
header{display:flex;align-items:center;gap:14px;margin-bottom:8px}
header img{width:44px;height:44px;border-radius:10px}
header b{font:800 22px 'Manrope',Arial,sans-serif;letter-spacing:2px;color:var(--ink)}
h1{font:800 34px/1.2 'Manrope',Arial,sans-serif;color:var(--ink);margin:18px 0 6px}
.sub{color:var(--muted);margin:0 0 28px}
.total{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:28px;color:var(--ink)}
.s{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:16px;break-inside:avoid}
.s h2{font:700 20px/1.35 'Manrope',Arial,sans-serif;color:var(--ink);margin:0 0 4px}
.s .meta{font-size:14px;font-weight:600;color:var(--blue);margin-bottom:10px}
.s p{margin:0 0 10px}
a{color:var(--blue)}
@media print{body{background:#fff;color:#111}.s{border-color:#ccc}}
</style>
</head>
<body>
<div class="wrap">
  <header><img src="../assets/logo.jpg" alt="AEPA logo"><b>AEPA</b></header>
  <h1>Session 4: Илтгэлийн скрипт</h1>
  <p class="sub">From prompt to workflow · Монгол ярианы хэлээр · <a href="./">Слайд руу буцах</a> · <a href="handouts.html">Гарын авлага</a></p>
  <div class="total" id="total">Ачаалж байна…</div>
  <div id="list"></div>
</div>
<script>
function mins(t){var p=t.split(':');return (+p[0])*60+(+(p[1]||0))}
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
fetch('index.html').then(function(r){return r.text()}).then(function(html){
  var doc=new DOMParser().parseFromString(html,'text/html');
  var slides=doc.querySelectorAll('.slide'),sum=0,out='';
  slides.forEach(function(s,n){
    var t=s.getAttribute('data-time')||'0:00';sum+=mins(t);
    var title=(s.querySelector('h2.t')||s.querySelector('h1')||{}).textContent||'';
    var eb=(s.querySelector('.eyebrow')||{}).textContent||'';
    var a=s.querySelector('aside.notes');
    out+='<section class="s"><h2>'+(n+1)+'. '+title.replace(/\s+/g,' ').trim()+'</h2><div class="meta">~'+t+(eb?' · '+eb:'')+'</div>'+(a?a.innerHTML:'')+'</section>';
  });
  document.getElementById('list').innerHTML=out;
  document.getElementById('total').innerHTML='<b>Нийт ~'+fmt(sum)+' мин</b> (демо, дасгалтай). Асуулт хариултад +10 мин. Санал болгох хугацаа: <b>70 мин</b>.';
}).catch(function(){
  document.getElementById('total').textContent='Скриптийг ачаалж чадсангүй. Слайд дээр N товч дарж тэмдэглэлийг харна уу.';
});
</script>
</body>
</html>
